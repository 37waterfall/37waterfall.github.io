<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#0b0e1a"/>
      <stop offset="38%" stop-color="#141935"/>
      <stop offset="72%" stop-color="#172a3f"/>
      <stop offset="100%" stop-color="#0a1622"/>
    </linearGradient>

    <radialGradient id="glowViolet" cx="18%" cy="8%" r="62%">
      <stop offset="0%"   stop-color="#6a4dff" stop-opacity="0.85"/>
      <stop offset="45%"  stop-color="#5a3ce0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5a3ce0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="88%" cy="18%" r="58%">
      <stop offset="0%"   stop-color="#22d3ff" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#12a8d8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#12a8d8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRose" cx="62%" cy="105%" r="72%">
      <stop offset="0%"   stop-color="#ff3f7f" stop-opacity="0.45"/>
      <stop offset="55%"  stop-color="#c22a86" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#c22a86" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="46%" r="78%">
      <stop offset="60%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <linearGradient id="streak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#glowViolet)"/>
  <rect width="1600" height="900" fill="url(#glowCyan)"/>
  <rect width="1600" height="900" fill="url(#glowRose)"/>

  <!-- 斜向柔光带 -->
  <g transform="rotate(-18 800 450)" opacity="0.9">
    <rect x="-200" y="150" width="2100" height="120" fill="url(#streak)"/>
    <rect x="-200" y="690" width="2100" height="46"  fill="url(#streak)" opacity="0.7"/>
  </g>

  <!-- 暗角，压住四周、让中间标题更立 -->
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
