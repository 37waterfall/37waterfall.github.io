<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="120%">
      <stop offset="0%"   stop-color="#0a0d18"/>
      <stop offset="34%"  stop-color="#141a36"/>
      <stop offset="64%"  stop-color="#152538"/>
      <stop offset="100%" stop-color="#091019"/>
    </linearGradient>

    <radialGradient id="glowViolet" cx="16%" cy="6%" r="66%">
      <stop offset="0%"   stop-color="#6d4cff" stop-opacity="0.80"/>
      <stop offset="42%"  stop-color="#5a3ce0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#5a3ce0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="92%" cy="12%" r="62%">
      <stop offset="0%"   stop-color="#1fd0ff" stop-opacity="0.50"/>
      <stop offset="48%"  stop-color="#12a8d8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#12a8d8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRose" cx="58%" cy="112%" r="70%">
      <stop offset="0%"   stop-color="#ff3f7f" stop-opacity="0.30"/>
      <stop offset="52%"  stop-color="#b52a7e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#b52a7e" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="44%" r="80%">
      <stop offset="58%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>

    <linearGradient id="streak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#cfe4ff" stop-opacity="0"/>
      <stop offset="46%"  stop-color="#cfe4ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#cfe4ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-60%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#glowViolet)"/>
  <rect width="1600" height="900" fill="url(#glowCyan)"/>
  <rect width="1600" height="900" fill="url(#glowRose)"/>

  <g transform="rotate(-17 800 450)" filter="url(#soft)">
    <rect x="-260" y="182" width="2200" height="86" fill="url(#streak)"/>
    <rect x="-260" y="668" width="2200" height="42" fill="url(#streak)" opacity="0.75"/>
  </g>

  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
